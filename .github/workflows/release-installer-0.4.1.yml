        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'sa-delirium-detect.json'
          & .\SA-Delirium-0.4.1-Setup.exe --detect --report $report
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $report)) { throw 'Compiled setup CLI smoke test failed' }
          $details = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
