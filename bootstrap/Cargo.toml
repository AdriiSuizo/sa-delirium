[package]
name = "sa-delirium-bootstrap"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
delirium = { path = "../vendor/src/delirium-physics/crates/delirium" }
delirium-data = { path = "../vendor/src/delirium-physics/crates/delirium-data" }
delirium-sdk = { path = "../vendor/src/delirium-physics/crates/delirium-sdk" }
iso_data = { package = "delirium-data", path = "../vendor/src/delirium-physics/crates/comparison-data" }
bevy_math = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_transform = { version = "=0.20.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = 2
